    const canvas=$(canvasId);if(!canvas)return;const ctx=canvas.getContext('2d');
    function resize(){canvas.width=canvas.offsetWidth*devicePixelRatio;canvas.height=canvas.offsetHeight*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio)}
    resize();window.addEventListener('resize',resize);_chartResizers.push(resize);
    return {ctx,canvas,resize};
  }
  const cpuC=makeChart('hwCpuChart'),memC=makeChart('hwMemChart');
  async function tick(){
    if(currentModule!=='hardware')return;
    const s=await api('/api/system/stats');
    if(s){hwCpuData.push(s.cpu_percent||0);hwMemData.push(s.memory_percent||0);if(hwCpuData.length>60)hwCpuData.shift();if(hwMemData.length>60)hwMemData.shift();
      $('hwCpuVal').textContent=(s.cpu_percent||0).toFixed(0)+'%';
      const usedMem=hardwareInfo&&hardwareInfo.memory_total?Math.round(hardwareInfo.memory_total*(s.memory_percent||0)/100/1073741824*10)/10:0;
      $('hwMemVal').textContent=(s.memory_percent||0).toFixed(0)+'%';
    }
    [cpuC,memC].forEach((c,ci)=>{if(!c)return;const{ctx,canvas}=c,data=ci?hwMemData:hwCpuData;
      drawSpark(ctx,canvas,[{data,color:ci?'90,143,192':'224,120,86',label:ci?'内存':'CPU'}],null);
    });
    hwRAF=setTimeout(tick,2000);
  }
  if(currentModule==='hardware')tick();
}
function stopHwCharts(){if(hwRAF){clearTimeout(hwRAF);hwRAF=null}}

async function loadPorts(token){
  renderModule('ports',`
    <div class="panel glass">
      <div class="panel-head"><div><div class="panel-title">${icon('i-plug')} 端口占用管理</div><div class="panel-desc">查看开发端口占用 · 一键终止进程</div></div>
        <div class="toolbar"><div class="search-box">${icon('i-search')}<input type="text" id="portSearch" placeholder="搜索端口或进程..."></div><button class="btn btn-sm btn-primary" onclick="loadPorts()">${icon('i-refresh')} 刷新</button></div></div>
      <div class="panel-body"><div id="portList"><div class="loading-state"><div class="spinner"></div>加载中...</div></div></div>
    </div>`,token);
  const d=await api('/api/ports');
  if(token!==undefined&&!stillOn('ports',token))return;
  ports=d?.ports||[];renderPorts();
  const psi=$('portSearch');if(psi)psi.oninput=debounce(renderPorts,180);
}
function renderPorts(){
  const box=$('portList');if(!box)return;const q=($('portSearch')?.value||'').toLowerCase();
  const list=ports.filter(p=>!q||String(p.port).includes(q)||(p.name||'').toLowerCase().includes(q)||(p.pid||'').toString().includes(q));
  if(!list.length){box.innerHTML='<div class="empty-state">'+icon('i-plug')+'<div>无匹配端口</div></div>';return}
  box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>端口</th><th>协议</th><th>PID</th><th>进程名</th><th>状态</th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr oncontextmenu="portContext(event,${p.pid||0},${p.port})"><td class="mono"><strong>${p.port}</strong></td><td class="mono">${esc(p.protocol||'TCP')}</td><td class="mono">${p.pid||'—'}</td><td>${esc(p.name||'未知')}</td><td><span class="badge badge-info">${esc(p.state||'LISTENING')}</span></td><td style="text-align:right">${p.pid?`<button class="btn btn-sm btn-danger" onclick="killProcess(${p.pid})">${icon('i-x')} 终止</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
async function killProcess(pid){
  confirmModal('终止进程',`将终止 PID <strong>${pid}</strong>，未保存的数据可能丢失。`,async()=>{
    const d=await api('/api/process/kill',{method:'POST',body:{pid}});
    if(d?.ok){toast('进程已终止','success');loadPorts()}else toast(d?.error||'失败','error');
  },{iconClass:'danger',confirmText:'确认终止',confirmClass:'btn-danger'});
}

function jsonFmt(pretty){try{const o=JSON.parse($('jsonIn').value);$('jsonOut').value=JSON.stringify(o,null,pretty?2:0)}catch(e){$('jsonOut').value='错误: '+e.message}}
function runRegex(){try{const p=new RegExp($('rePattern').value,$('reFlags').checked?'g':'');const t=$('reText').value;const m=t.match(p);$('reResult').innerHTML=m?`<span class="badge badge-success">匹配 ${m.length} 处</span><div style="margin-top:6px;font-family:var(--font-mono);font-size:11px">${m.slice(0,20).map(x=>esc(x)).join('<br>')}</div>`:'<span class="badge badge-neutral">无匹配</span>'}catch(e){$('reResult').innerHTML='<span class="badge badge-danger">正则错误</span>'}}
let encModeCur='base64';
function encMode(m,btn){encModeCur=m;btn.parentElement.querySelectorAll('.subtab').forEach(s=>s.classList.remove('active'));btn.classList.add('active');runEncode()}
function runEncode(){const v=$('encIn').value;try{let r='';if(encModeCur==='base64')r=btoa(unescape(encodeURIComponent(v)));else if(encModeCur==='url')r=encodeURIComponent(v);else r=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');$('encOut').value=r}catch(e){$('encOut').value='错误: '+e.message}}
async function runHash(){const v=$('hashIn').value;if(!v){$('hashOut').innerHTML='';return}const enc=new TextEncoder().encode(v);const algos=['SHA-1','SHA-256','SHA-384','SHA-512'];let html='';for(const a of algos){const h=await crypto.subtle.digest(a,enc);html+=`<div><strong>${a}:</strong> <span style="color:var(--text-2)">${[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}</span></div>`}html+=`<div><strong>MD5:</strong> <span style="color:var(--text-2)">${simpleMd5(v)}</span></div>`;$('hashOut').innerHTML=html}
function simpleMd5(s){function rl(n,c){return(n<<c)|(n>>>(32-c))}function rh(s){const l=s.length;const a=[l&0xff,(l>>8)&0xff,(l>>16)&0xff,(l>>24)&0xff];const b=[];for(let i=0;i<l;i++)b[i>>2]|=(s.charCodeAt(i))<<((i%4)*8);b[b.length]=0x80;while(b.length%16!==14)b.push(0);b.push(...a);return b}function au(x,c){const sl='0123456789abcdef';let r='';for(let i=0;i<4;i++)r+=sl.charAt((x>>(i*8+4))&0x0f)+sl.charAt((x>>(i*8))&0x0f);return r}s=unescape(encodeURIComponent(s));const x=rh(s);let a=1732584193,b=-271733879,c=-1732584194,d=271733878;for(let i=0;i<x.length;i+=16){const oa=a,ob=b,oc=c,od=d;for(let j=0;j<64;j++){let f,g;if(j<16){f=(b&c)|(~b&d);g=j}else if(j<32){f=(d&b)|(~d&c);g=(5*j+1)%16}else if(j<48){f=b^c^d;g=(3*j+5)%16}else{f=c^(b|~d);g=(7*j)%16}f=f+a+[0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391][j]+(x[i+g]||0);a=d;d=c;c=b;b=b+rl(f,[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21][j])}a=(a+oa)|0;b=(b+ob)|0;c=(c+oc)|0;d=(d+od)|0}return au(a)+au(b)+au(c)+au(d)}
function genPw(){let ch='';if($('pwUpper').checked)ch+='ABCDEFGHJKLMNPQRSTUVWXYZ';if($('pwLower').checked)ch+='abcdefghijkmnpqrstuvwxyz';if($('pwNum').checked)ch+='23456789';if($('pwSym').checked)ch+='!@#$%^&*';const len=parseInt($('pwLen').value)||16;let pw='';for(let i=0;i<len;i++)pw+=ch[Math.floor(Math.random()*ch.length)];$('pwOut').textContent=pw}
function tsConvert(){const v=parseInt($('tsInput').value);if(!v)return;const d=new Date(v*1000);$('tsOut').textContent=d.toLocaleString('zh-CN')+' (本地) · '+d.toISOString()+' (UTC)'}
function tsConvertDate(){const v=$('tsDate').value;if(!v)return;const d=new Date(v.replace(/-/g,'/'));if(!isNaN(d))$('tsOut').textContent='Unix: '+Math.floor(d.getTime()/1000)}
function colorConvert(){const h=$('colorPick').value;$('colorHex').value=h;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);$('colorOut').innerHTML=`<div><strong>RGB:</strong> rgb(${r}, ${g}, ${b})</div><div><strong>HSL:</strong> ${rgbToHsl(r,g,b)}</div>`}
function colorFromHex(){let v=$('colorHex').value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v)){$('colorPick').value=v;colorConvert()}}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4}h/=6}return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`}
function runDiff(){const a=$('diffA').value.split('\n'),b=$('diffB').value.split('\n');let html='';const max=Math.max(a.length,b.length);for(let i=0;i<max;i++){const la=a[i]||'',lb=b[i]||'';if(la===lb)html+=`<div style="color:var(--text-3)">${i+1}: ${esc(la)}</div>`;else{if(la)html+=`<div style="background:var(--danger-s);color:var(--danger)">- ${esc(la)}</div>`;if(lb)html+=`<div style="background:var(--success-s);color:var(--success)">+ ${esc(lb)}</div>`}}$('diffOut').innerHTML=html}
function jsonToYaml(){try{const o=JSON.parse($('jsonIn').value);$('jsonOut').value=toYaml(o,0)}catch(e){$('jsonOut').value='错误: '+e.message}}
function toYaml(v,d){const ind='  '.repeat(d);if(v===null)return 'null';if(typeof v!=='object')return String(v);if(Array.isArray(v))return v.map(x=>ind+'- '+toYaml(x,d+1).replace(/^\s+/,'')).join('\n');return Object.keys(v).map(k=>ind+k+': '+(typeof v[k]==='object'&&v[k]!==null?'\n'+toYaml(v[k],d+1):toYaml(v[k],d))).join('\n')}
function b64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function decodeJwt(){const t=($('jwtIn').value||'').trim();const p=t.split('.');if(p.length<2){$('jwtOut').textContent='不是有效 JWT';return}try{$('jwtOut').textContent=JSON.stringify({header:JSON.parse(b64url(p[0])),payload:JSON.parse(b64url(p[1]))},null,2)}catch(e){$('jwtOut').textContent='解码失败: '+e.message}}
function genUuids(){$('uuidOut').textContent=Array.from({length:10},()=>crypto.randomUUID()).join('\n')}
function parseCron(){

  const names=['分钟','小时','日','月','星期'];
  if(parts.length<5){$('cronOut').textContent='需要 5 段：分 时 日 月 周';return}

}
function fmtSql(){const s=$('sqlIn').value;const k='select,from,where,and,or,left join,right join,inner join,order by,group by,limit,insert into,values,update,set,delete'.split(',');let o=s;k.forEach(w=>{o=o.replace(new RegExp('\\b'+w+'\\b','ig'),'\n'+w.toUpperCase())});$('sqlOut').value=o.replace(/^\n/,'').replace(/\s+\n/g,'\n')}
function htmlToJsx(){let s=$('jsxIn').value;s=s.replace(/\bclass=/g,'className=').replace(/\bfor=/g,'htmlFor=').replace(/<((img|br|hr|input|meta|link)[^>]*?)>/g,'<$1 />');$('jsxOut').value=s}
async function probeHttp(){

function saveSnippet(){
  const title=($('snipTitle').value||'未命名').trim(),body=$('snipBody').value||'';
  if(!body){toast('内容为空','error');return}
  const list=prefs.get('snippets',[]);list.unshift({title,body,ts:Date.now()});prefs.set('snippets',list.slice(0,40));
  toast('已保存本地','success');renderSnippets();
}
function delSnippet(i){const list=prefs.get('snippets',[]);list.splice(i,1);prefs.set('snippets',list);renderSnippets()}
function runRadix(){
  const raw=($('radixIn').value||'').trim();
  let n=NaN;
  if(/^0x/i.test(raw))n=parseInt(raw,16);
  else if(/^0b/i.test(raw))n=parseInt(raw.slice(2),2);
  else n=parseInt(raw,10);
  if(!Number.isFinite(n)){$('radixOut').textContent='无法解析';return}
  $('radixOut').innerHTML=`DEC ${n}<br>HEX 0x${n.toString(16).toUpperCase()}<br>BIN 0b${n.toString(2)}<br>OCT 0o${n.toString(8)}`;
}
function runUrlParse(){
  try{
    const u=new URL($('urlIn').value);
    const q=[...u.searchParams.entries()].map(([k,v])=>`${esc(k)} = ${esc(v)}`).join('<br>')||'（无）';
    $('urlOut').innerHTML=`<dl class="detail-grid"><dt>协议</dt><dd>${esc(u.protocol)}</dd><dt>主机</dt><dd class="mono">${esc(u.host)}</dd><dt>路径</dt><dd class="mono">${esc(u.pathname)}</dd><dt>Query</dt><dd>${q}</dd><dt>Hash</dt><dd class="mono">${esc(u.hash||'—')}</dd></dl>`;
  }catch{$('urlOut').textContent='不是合法 URL'}
}

async function detectProject(){
  const p=($('projPath')?.value||'').trim();if(!p){toast('请输入项目路径','error');return}
  $('projResult').innerHTML='<div class="loading-state"><div class="spinner"></div>探测中...</div>';
  const d=await api('/api/project/detect?path='+encodeURIComponent(p));
  if(!d?.ok){$('projResult').innerHTML=`<span class="badge badge-danger">${esc(d?.error||'探测失败')}</span>`;return}

}

function showSnapshot(){
  const opts=environments.map(e=>`<option value="${e.id}">${esc(e.type)} ${esc(e.version)} — ${esc(e.path)}</option>`).join('');

async function doSnapshot(){
  const env_id=$('snapEnv').value,full=$('snapFull').checked;closeModal();
  const d=await api('/api/snapshot',{method:'POST',body:{env_id,full}});
  if(d?.job_id)await streamJob(d.job_id,()=>toast('快照已生成，见 backups/ 目录','success'));
  else if(d?.ok)toast('快照: '+d.path,'success');
  else toast(d?.error||'快照失败','error');
}
async function showSecurityScan(){
  const sel=$('diagEnvSelect');const env_id=sel?.value||(environments[0]&&environments[0].id);
  if(!env_id){toast('请先选择环境','error');return}
  showModal(`<div class="modal-title">依赖安全扫描</div><div class="modal-body"><div class="loading-state"><div class="spinner"></div>查询 OSV.dev 与本地规则...</div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">关闭</button></div>`);
  const d=await api('/api/security/scan?env_id='+encodeURIComponent(env_id));
  if(!d){closeModal();return}
  window._secScan=d;
  const src=d.osv?'OSV.dev + 本地规则':'离线本地规则'+(d.osv_error?' · '+d.osv_error:'');
  const rows=(d.findings||[]).map(f=>`<tr><td><strong>${esc(f.name)}</strong></td><td class="mono">${esc(f.version)}</td><td><span class="badge ${f.level==='高'?'badge-danger':f.level==='中'?'badge-warning':'badge-info'}">${esc(f.level)}</span></td><td style="font-size:12px">${esc(f.reason)}</td><td class="mono">${esc(f.suggest||'—')}</td></tr>`).join('');

function activeCodingSeconds(){
  const idle=Date.now()-(_lastActive||Date.now());
  return idle>5*60*1000?0:1;
}
function tickCodingClock(){
  if(!window._codingStart)window._codingStart=Date.now();
  const day=new Date().toISOString().slice(0,10);
  const hist=prefs.get('codingHist',{});
  if(!window._codingAcc)window._codingAcc=hist[day]||0;
  if(window._codingTick)return;
  window._codingTick=setInterval(()=>{
    if(activeCodingSeconds()){window._codingAcc+=1;saveTodayCoding()}
    const el=$('codingTime');if(!el)return;
    const s=Math.floor(window._codingAcc),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');
    el.textContent=`${h}:${m}:${sec}`;
  },1000);
}
function saveTodayCoding(){
  const day=new Date().toISOString().slice(0,10);
  const hist=prefs.get('codingHist',{});
  hist[day]=(hist[day]||0)+1;
  const keys=Object.keys(hist).sort();
  while(keys.length>30){delete hist[keys.shift()]}
  prefs.set('codingHist',hist);
}
function drawCodeHist(){
  const c=$('codeHist');if(!c)return;
  const ctx=c.getContext('2d'),w=c.width,h=c.height,hist=prefs.get('codingHist',{});
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toISOString().slice(0,10);return {k,v:(hist[k]||0)/3600}});
  const max=Math.max(1,...days.map(d=>d.v));
  ctx.clearRect(0,0,w,h);
  days.forEach((d,i)=>{
    const bw=(w-20)/7,x=10+i*bw+6,bh=(d.v/max)*(h-28);
    ctx.fillStyle='rgba(224,120,86,.8)';ctx.fillRect(x,h-18-bh,bw-12,bh);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-3');ctx.font='11px sans-serif';
    ctx.fillText(d.k.slice(5),x,h-4);
  });
}
function stretchSvg(i){
  const poses=[
    '<path d="M12 4v8M8 8l4-4 4 4M8 20h8"/>',
    '<path d="M12 20V8M8 12h8M6 6l4 4M18 6l-4 4"/>',
    '<circle cx="12" cy="6" r="2"/><path d="M12 8v6M8 20l4-6 4 6"/>',
    '<path d="M6 18c4-10 8-10 12 0M12 4v6"/>'
  ];
  return `<svg viewBox="0 0 24 24" width="64" height="64">${poses[i%poses.length]}</svg>`;
}

function hexToRgb(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6)return[224,120,86];
  const n=parseInt(h,16);if(Number.isNaN(n))return[224,120,86];
  return[(n>>16)&255,(n>>8)&255,n&255];
}

  root.dataset.skin=id;

/* 宠物小窗可拖拽（记忆位置），点击（未拖动）触发互动 */
(function(){
  let sx=0,sy=0,ox=0,oy=0,moved=false,dragging=false;
  document.addEventListener('pointerdown',e=>{
    const dock=e.target.closest&&e.target.closest('#petDock');
    if(!dock)return;
    dragging=true;moved=false;
    sx=e.clientX;sy=e.clientY;
    const r=dock.getBoundingClientRect();ox=r.left;oy=r.top;
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;window._petDragged=true;
    const dock=$('petDock');if(!dock)return;
    const x=Math.max(6,Math.min(innerWidth-100,ox+dx));
    const y=Math.max(6,Math.min(innerHeight-120,oy+dy));
    dock.style.right='auto';dock.style.bottom='auto';
    dock.style.left=x+'px';dock.style.top=y+'px';
  },{passive:true});
  document.addEventListener('pointerup',()=>{
    if(!dragging)return;
    dragging=false;
    if(moved){
      const dock=$('petDock');
      if(dock)prefs.set('petPos',{x:dock.style.left,y:dock.style.top});
      setTimeout(()=>{window._petDragged=false},120);
    }
  },{passive:true});
})();

  }
}

async function sendAi(){
  if(_aiBusy)return;
  const input=$('aiInput');
  const text=(input?.value||'').trim();if(!text)return;
  if(input)input.value='';
  _aiMsgs.push({role:'user',content:text});
  aiSaveHist();renderAiLog();
  const messages=_aiMsgs.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}));
  const rolePrompt=(_aiRoles.find(r=>r.id===($('aiRole')?.value||'default'))||{}).prompt||'';
  const provider=$('aiProv')?.value,model=$('aiModel')?.value;
  const temperature=(parseInt(($('aiTemp')?.value??'4'),10)||4)/10;
  const useStream=$('aiStream')?.checked!==false;
  _aiBusy=true;toggleAiBusy(true);
  const idx=_aiMsgs.push({role:'assistant',content:''})-1;
  let streamed=false;
  if(useStream){
    try{
      const ctrl=new AbortController();_aiAbort=ctrl;
      const r=await fetch('/api/ai/chat-stream',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Avenger-Token':AVENGER_TOKEN},
        body:JSON.stringify({provider,model,messages,system:rolePrompt,temperature}),
        signal:ctrl.signal,
      });
      if(!r.ok||!r.body)throw new Error('HTTP '+r.status);
      const reader=r.body.getReader(),dec=new TextDecoder();
      let buf='';
      const paint=debounce(()=>{_aiMsgs[idx].content=buf;renderAiLog()},110);
      for(;;){
        const {done,value}=await reader.read();
        if(done)break;
        buf+=dec.decode(value,{stream:true});
        paint();
      }
      _aiMsgs[idx].content=buf||'(空回复)';
      streamed=true;
    }catch(e){
      if(e&&e.name==='AbortError'){
        _aiMsgs[idx].content=(_aiMsgs[idx].content||'')+'\n[已停止]';
        streamed=true;
      }else{
        _aiMsgs.splice(idx,1);
      }
    }finally{_aiAbort=null}
  }
  if(!streamed){
    const d=await api('/api/ai/chat',{method:'POST',body:{provider,model,messages,system:rolePrompt,temperature}});
    if(d&&d.ok)_aiMsgs.push({role:'assistant',content:d.content||'(空回复)'});
    else _aiMsgs.push({role:'assistant',content:(d&&d.error)||'请求失败'});
  }
  _aiBusy=false;toggleAiBusy(false);
  aiSaveHist();renderAiLog();
}

function doMcpDoctor(){
  const box=$('mcpDoctorOut');const raw=($('mcpJson')||{}).value||'';
  let data;try{data=JSON.parse(raw)}catch(e){box.innerHTML='<span class="badge badge-danger">JSON 解析失败: '+esc(e.message.slice(0,80))+'</span>';return}
  const servers=data.mcpServers||data.servers||null;
  if(!servers||typeof servers!=='object'){box.innerHTML='<span class="badge badge-danger">未找到 mcpServers / servers 配置块</span>';return}
  const issues=[];const names=Object.keys(servers);
  names.forEach(n=>{const c=servers[n]||{};
    if(!c.command)issues.push(n+': 缺少 command');
    if(!Array.isArray(c.args))issues.push(n+': args 应为数组');});
  box.innerHTML='<span class="badge '+(issues.length?'badge-warning':'badge-success')+'">'+(issues.length?issues.length+' 处问题':'结构合法 · '+names.length+' 个服务器')+'</span>'
    +(issues.length?'<ul style="font-size:12px;margin:8px 0 0 18px;line-height:1.8">'+issues.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':'')
    +'<div style="font-size:11px;color:var(--text-3);margin-top:8px">建议：npx/uvx 类命令首启需联网拉包；Windows 下 command 用 npx.cmd 更稳。</div>';
}

function memListHtml(list){
  const q=_memQ.toLowerCase();

  return rows.length?rows.map(m=>`<div class="mem-item" style="cursor:pointer" onclick="memRelated('${m.id}')" title="点击查看关联记忆"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mk">${esc(m.kind)}</span><span style="display:flex;gap:6px;align-items:center"><span style="font-size:10px;color:var(--text-4)">${esc(m.created||'')}</span><button class="btn btn-sm btn-ghost btn-icon" onclick="memDel('${m.id}')" title="删除">${icon('i-trash')}</button></span></div><div style="font-size:12.5px;line-height:1.6;margin-top:3px">${esc(m.content)}</div>${m.tags?`<div style="margin-top:5px">${m.tags.split(/[,，]/).filter(Boolean).map(t=>`<span class="badge badge-accent" style="font-size:9px">${esc(t.trim())}</span>`).join(' ')}</div>`:''}</div>`).join(''):'<div class="empty-state">没有记忆</div>';

function renderCtxPane(){

async function ctxScanGo(){
  const p=($('ctxPath').value||'').trim();if(!p){toast('填写项目路径','error');return}
  $('ctxResult').innerHTML='<div class="loading-state"><div class="spinner"></div>索引中（限深 4 层 / 3000 文件）…</div>';
  const d=await api('/api/agent/context/scan?path='+encodeURIComponent(p));
  if(!d?.ok){$('ctxResult').innerHTML=`<div class="empty-state">${esc(d?.error||'扫描失败')}</div>`;return}
  _ctxScan=d;

  $('ctxResult').innerHTML=`
    <div class="statline a-init" style="margin-bottom:14px">
      <div class="st"><b data-count="${d.files}">0</b><span>文件</span></div>

      <div class="st"><b style="font-size:16px;padding-top:8px">${esc(d.frameworks.join(' · ')||'—')}</b><span>技术栈线索</span></div>

    <div id="ctxPackOut" style="margin-top:12px"></div>`;

async function ctxPack(save){
  if(!_ctxScan)return;
  const box=$('ctxPackOut');
  box.innerHTML='<div class="loading-state"><div class="spinner"></div>压缩上下文中…</div>';
  const d=await api('/api/agent/context/pack',{method:'POST',body:{path:_ctxScan.path,save}});
  if(!d?.ok){box.innerHTML=`<div class="empty-state">${esc(d?.error||'失败')}</div>`;return}
  if(save&&d.saved){box.innerHTML=`<div class="badge badge-success">${icon('i-check')} 已写入 ${esc(d.saved)} · ${d.chars} 字符</div>`;toast('上下文包已写入项目','success');return}
  window._ctxPackText=d.pack;
  box.innerHTML=`<div class="code-block a-init"><div class="code-head"><b>CONTEXT_PACK.md · ${d.chars} 字符</b><span style="display:flex;gap:6px"><button class="btn btn-sm" onclick="copyPath(window._ctxPackText)">${icon('i-copy')} 复制</button><button class="btn btn-sm btn-primary" onclick="downloadText('CONTEXT_PACK.md',window._ctxPackText)">${icon('i-save')} 下载</button></span></div><pre>${esc(d.pack.slice(0,4000))}${d.pack.length>4000?'\n…（预览截断，下载/复制得全文）':''}</pre></div>`;
  choreo(box);
}

const ARCH_KV={'0.5B':{layers:24,kv:896},'1.5B':{layers:28,kv:1024},'3B':{layers:36,kv:1024},'7B':{layers:32,kv:1024},'8B':{layers:32,kv:1024},'14B':{layers:48,kv:1024},'32B':{layers:64,kv:1024},'70B':{layers:80,kv:1024}};

function forgeCalc(){
  const p=parseFloat(_forge.params),a=ARCH_KV[_forge.params]||ARCH_KV['8B'],q=QUANT_LOCAL.find(x=>x.id===_forge.quant)||QUANT_LOCAL[4];
  const w=p*q.bpw, kv=a.layers*4*a.kv*_forge.ctx*1000/(1024**3);
  return {w,kv,oh:0.6,total:w+kv+0.6,q};
}

function trainVramCalc(){
  const p=parseFloat($('tvParams').value)||7, method=$('tvMethod').value, ctx=parseInt($('tvCtx').value)||2, batch=parseInt($('tvBatch').value)||2;
  let total,note;
  if(method==='full'){total=p*8+0.35*ctx*batch;note='全参微调：7B 需 ≥60GB（DeepSpeed ZeRO-3/FSDP 多卡）'}
  else if(method==='lora'){total=p*2.05+0.10*ctx*batch+1.0;note='LoRA：基座 bf16 + 适配器，7B≈16-18GB'}
  else{total=p*0.62+0.06*ctx*batch+1.5;note='QLoRA：基座 4bit，7B≈5-6GB，消费级单卡首选'}
  const gpu=(hardwareInfo&&hardwareInfo.gpu_mem)?Math.round(hardwareInfo.gpu_mem.mem_total_mb/1024):8;
  $('tvOut').innerHTML=`<div class="card glass-light" style="padding:14px"><div style="display:flex;justify-content:space-between"><b style="font-family:var(--font-serif);font-size:22px">${total.toFixed(1)} GB</b><span class="badge ${total<=gpu*0.94?'badge-success':'badge-danger'}">${total<=gpu*0.94?'本机可训':'超出 GPU '+gpu+'GB'}</span></div><div style="font-size:11.5px;color:var(--text-3);margin-top:6px">${esc(note)}</div></div>`;
}

function fnSafe(expr){
  let e=expr.replace(/\^/g,'**');
  const ids=e.match(/[a-zA-Z_]+/g)||[];
  const allow=new Set(['x','sin','cos','tan','asin','acos','atan','sqrt','log','abs','exp','floor','round','pi','E','PI']);
  for(const i of ids){if(!allow.has(i))return null}
  return e;
}
function fnPlot(){
  const c=$('fnCanvas');if(!c)return;
  const ctx=c.getContext('2d'),W=c.width,H=c.height,R=parseFloat($('fnRange').value)||10;
  const raw=($('fnExpr').value||'').trim();
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(128,128,128,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  const e=fnSafe(raw);
  if(!e){ctx.fillStyle='#d06058';ctx.font='13px sans-serif';ctx.fillText('含不允许的符号（仅 x 与数学函数）',20,30);return}
  let f;try{f=new Function('x','with(Math){return ('+e+')}')}catch(err){ctx.fillStyle='#d06058';ctx.font='13px sans-serif';ctx.fillText('表达式错误',20,30);return}
  const sx=W/(2*R),sy=H/(2*R)*0.8;
  const px=x=>W/2+x*sx, py=y=>H/2-y*sy;
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#e07856';
  const axes=()=>{
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(128,128,128,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-3');ctx.font='11px sans-serif';
    ctx.fillText('f(x) = '+raw,14,20);
  };
  ctx.lineWidth=2;
  let rev=0;
  (function draw(){
    rev=Math.min(1,rev+0.05);
    axes();
    ctx.strokeStyle=accent;ctx.beginPath();
    const lim=Math.max(2,Math.floor(W*rev));
    let started=false;
    for(let X=0;X<lim;X++){
      const x=(X-W/2)/sx, y=f(x);
      if(Number.isFinite(y)){const Y=py(y);started?(ctx.lineTo(X,Y)):(ctx.moveTo(X,Y),started=true)}
      else started=false;
    }
    ctx.stroke();
    if(rev<1)requestAnimationFrame(draw);
  })();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-3');ctx.font='11px sans-serif';
  ctx.fillText('f(x) = '+raw,14,20);
}
function mxParse(t){return t.split(';').map(r=>r.split(/[,，\s]+/).filter(Boolean).map(Number))}
function mxCalc(){
  const op=$('mxOp').value,A=mxParse($('mxA').value),B=mxParse($('mxB').value),out=$('mxOut');
  const fmt=M=>M.map(r=>r.map(x=>(+x.toFixed(4))).join('  ')).join('\n');
  try{
    if(op==='det'){
      if(A.length===2&&A[0].length===2){out.textContent='det(A) = '+(A[0][0]*A[1][1]-A[0][1]*A[1][0])}
      else if(A.length===3&&A.every(r=>r.length===3)){out.textContent='det(A) = '+(A[0][0]*(A[1][1]*A[2][2]-A[1][2]*A[2][1])-A[0][1]*(A[1][0]*A[2][2]-A[1][2]*A[2][0])+A[0][2]*(A[1][0]*A[2][1]-A[1][1]*A[2][0]))}
      else out.textContent='行列式仅支持 2×2 / 3×3';
    }else{
      if(A[0].length!==B.length){out.textContent='维度不匹配：A 列数需等于 B 行数';return}
      const C=A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
      out.textContent=fmt(C);
    }
  }catch(e){out.textContent='错误: '+e.message}
}

function mmCalc(){
  const f=($('mmIn')||{}).value||'';const out=$('mmOut');if(!out)return;
  const mass={};ELEMENTS.forEach(e=>mass[e[0]]=e[3]);
  const tokens=f.match(/([A-Z][a-z]?)(\d*\.?\d*)|\(([^()]*)\)(\d*\.?\d*)|·(\d*\.?\d*)/g);
  if(!tokens){out.innerHTML='<span class="badge badge-danger">无法解析化学式</span>';return}
  let total=0;
  const parse=(seg,mult)=>{let sum=0;const re=/([A-Z][a-z]?)(\d*\.?\d*)/g;let m;while((m=re.exec(seg))){sum+=(mass[m[1]]||0)*(m[2]?parseFloat(m[2]):1)}return sum*mult};
  try{
    tokens.forEach(t=>{
      const paren=t.match(/^\(([^()]*)\)(\d*\.?\d*)$/);
      const dot=t.match(/^·(\d*\.?\d*)$/);
      if(paren)total+=parse(paren[1],paren[2]?parseFloat(paren[2]):1);
      else if(dot){/* 与前段相乘略（支持简单式）*/ }
      else{const re=/([A-Z][a-z]?)(\d*\.?\d*)/g;let m;while((m=re.exec(t))){total+=(mass[m[1]]||0)*(m[2]?parseFloat(m[2]):1)}}
    });
    out.innerHTML='总摩尔质量：<b style="font-family:var(--font-serif);font-size:20px;color:var(--accent)">'+total.toFixed(3)+' g/mol</b>';
  }catch(e){out.innerHTML='<span class="badge badge-danger">计算错误</span>'}
}

function dnaRun(){
  const dna=dnaClean();const out=$('dnaOut');if(!out)return;
  if(!dna){out.innerHTML='<span class="badge badge-warning">请输入序列</span>';return}
  const comp={A:'T',T:'A',G:'C',C:'G'};
  const rc=[...dna].map(c=>comp[c]).reverse().join('');
  const rna=[...dna].map(c=>c==='T'?'U':c).join('');
  let prot='',started=false;
  for(let i=0;i+2<dna.length;i+=3){

    const aa=CODON[cod.replace('T','U').replace(/T/g,'U')];

    prot+=aa;
  }
  const count={A:0,T:0,G:0,C:0};for(const c of dna)count[c]=(count[c]||0)+1;

function kinGo(){
  const v0=parseFloat($('kv0').value)||0,a=parseFloat($('ka').value)||0,t=parseFloat($('kt').value)||0;
  const v=v0+a*t,d=v0*t+0.5*a*t*t;
  $('kinOut').innerHTML='<div class="card glass-light" style="padding:12px;font-size:13px;line-height:1.9">末速度 v = v₀+at = <b class="mono">'+v.toFixed(3)+' m/s</b><br>位移 s = v₀t+½at² = <b class="mono">'+d.toFixed(3)+' m</b></div>';
  const c=$('kinCanvas');if(!c)return;
  const ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#e07856';
  const N=60,vMax=Math.max(Math.abs(v0),Math.abs(v),0.001);
  ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=N;i++){
    const tt=t*i/N,x=20+(W-40)*i/N,y=H/2-(v0+a*tt)/(vMax*1.1)*(H/2-20);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-3');ctx.font='11px sans-serif';
  ctx.fillText('v-t 图像（0 → '+t+'s）',16,18);
}

}

  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#e07856';
  ctx.strokeStyle='rgba(128,128,128,.4)';ctx.beginPath();ctx.moveTo(30,H/2);ctx.lineTo(W-30,H/2);ctx.stroke();
  items.forEach((it,i)=>{
    const x=X(it[0]),up=i%2===0;
    ctx.fillStyle=accent;
    ctx.beginPath();ctx.arc(x,H/2,4,0,6.29);ctx.fill();
    ctx.strokeStyle='rgba(128,128,128,.35)';ctx.beginPath();ctx.moveTo(x,H/2);ctx.lineTo(x,up?H/2-34:H/2+14);ctx.stroke();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-2');ctx.font='11px sans-serif';
    ctx.fillText(it[1],Math.min(x+4,W-140),up?H/2-24:H/2+28);
    ctx.fillStyle='rgba(128,128,128,.6)';
    ctx.fillText(String(it[0]),Math.min(x+4,W-60),up?H/2-38:H/2+42);
  });
}

function kataSolvedSet(){return new Set(prefs.get('kataSolved',[]))}
function markKataSolved(id){
  const arr=prefs.get('kataSolved',[]);
  if(!arr.includes(id)){arr.push(id);prefs.set('kataSolved',arr)}
  const today=new Date().toISOString().slice(0,10);
  const st=prefs.get('kataStreak',{last:'',count:0});
  if(st.last!==today){
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    st.count=(st.last===y)?(st.count||0)+1:1;
    st.last=today;
  }
  prefs.set('kataStreak',st);
}
function dailyKataId(){
  if(!_katas.length)return null;

}

function playChime(){
  if(prefs.get('muteChime',false))return;
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close()},180)}catch{}
}
function snoozeRest(min){closeModal();toast(`已延后 ${min} 分钟`,'info');setTimeout(()=>showEyeRest(),min*60000)}
function applyEyeSchedule(){
  const on=prefs.get('eyeOnAt',''),off=prefs.get('eyeOffAt','');
  if(!on||!off)return;
  const now=new Date(),hm=now.getHours()*60+now.getMinutes();
  const parse=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
  const a=parse(on),b=parse(off);
  const night=a>b?(hm>=a||hm<b):(hm>=a&&hm<b);
  if(night&&!eyeCareOn)toggleEyeCare();
  if(!night&&eyeCareOn)toggleEyeCare();
}
function burstSparkles(x,y){
  if(prefs.get('delight',true)===false)return;
  if(document.documentElement.classList.contains('reduce-motion'))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches && prefs.get('reduceMotion','auto')!=='off')return;
  const n=8;
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='burst-dot';
    const px=x??innerWidth*0.55,py=y??80;
    d.style.left=px+'px';d.style.top=py+'px';
    document.body.appendChild(d);
    const ang=Math.random()*Math.PI*2,dist=24+Math.random()*40;
    d.animate([{transform:'translate(0,0)',opacity:.9},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`,opacity:0}],{duration:280,easing:'cubic-bezier(.32,.72,0,1)'});
    setTimeout(()=>d.remove(),300);
  }
}

function runSlash(cmd){
  const [a,...rest]=cmd.trim().split(/\s+/);const arg=rest.join(' ');
  if(a==='scan')rescan();
  else if(a==='undo')undoLast();
  else if(a==='disk'){switchModule('hardware');setTimeout(scanDiskOverview,400)}
  else if(a==='theme'){if(arg==='dark'||arg==='light'){document.documentElement.setAttribute('data-theme',arg);prefs.set('theme',arg)}else toggleTheme()}
  else if(a==='cache'&&arg==='purge')switchModule('python');
  else if(a==='install'&&arg){switchModule('packages');selectedPkgEnv=selectedPkgEnv||environments[0]?.id;api('/api/package/install',{method:'POST',body:{env_id:selectedPkgEnv,package:arg}}).then(j=>j?.job_id&&streamJob(j.job_id,()=>loadPackages()))}
  else toast('未知命令。可用: scan / undo / disk / theme dark / cache purge / install <pkg>','warn');
}

function offerUndo(undo,msg){
  if(!undo||!undo.id){if(msg)toast(msg,'success');return}
  toast((msg||undo.label||'操作完成')+' · 可撤销','success',{undoId:undo.id});
  const bar=$('undoBar');
  if(bar){bar.classList.add('show');bar.innerHTML=`<span>${esc(undo.label||'可撤销')}</span><button class="btn btn-sm btn-primary" onclick="doUndo('${undo.id}')">撤销 Ctrl+Z</button>`;setTimeout(()=>bar.classList.remove('show'),12000)}

async function doUndo(id){
  if(!id)return;
  const d=await api('/api/undo',{method:'POST',body:{id}});
  const bar=$('undoBar');if(bar)bar.classList.remove('show');
  if(!d?.ok){toast(d?.error||'无法撤销','error');return}
  if(d.job_id)await streamJob(d.job_id,()=>loadPackages());
  else toast(d.message||'已撤销','success');
}
async function undoLast(){
  const d=await api('/api/undo');

async function openDiskTreemap(path){
  if($('diskPanel')){/* stay in hardware */}
  const box=$('diskPanel')||$('cacheContent');
  if(!box){
    showModal(`<div class="modal-title">磁盘树图</div><div class="modal-body"><div class="loading-state"><div class="spinner"></div></div></div>`);
  }
  const d=await api('/api/disk/tree?path='+encodeURIComponent(path));
  if(!d?.ok){toast(d?.error||'无法扫描该路径','error');return}
  const kids=d.children||[];
  if($('diskPanel')){
    const crumb=$('tmCrumb');
    if(crumb)crumb.innerHTML=`<button type="button" onclick="scanDiskOverview()">根</button><span style="color:var(--text-4)">/</span><span class="mono">${esc(d.path)}</span>
      <button class="btn btn-sm" onclick="openPath('${esc(d.path).replace(/\\/g,'\\\\')}')">打开目录</button>`;
    drawTreemapInto($('tmCanvas'),$('tmTip'),kids,d.path,item=>{if(item.dir)openDiskTreemap(item.path)});
    return;
  }
  $('modalContent').style.maxWidth='760px';
  showModal(`<div class="modal-title">占用 · ${esc(d.path)}</div><div class="modal-body">
    <div class="treemap-wrap" style="height:320px"><canvas id="tmModal"></canvas><div class="treemap-tip" id="tmModalTip"></div></div>
  </div><div class="modal-footer"><button class="btn" onclick="openPath('${esc(d.path).replace(/\\/g,'\\\\')}')">打开</button><button class="btn" onclick="closeModal()">关闭</button></div>`);
  setTimeout(()=>drawTreemapInto($('tmModal'),$('tmModalTip'),kids,d.path,item=>{if(item.dir){closeModal();openDiskTreemap(item.path)}}),40);
}
function sliceRects(items,x,y,w,h){
  const total=items.reduce((s,i)=>s+Math.max(i.size||0,1),0);
  let acc=0;const out=[];
  const horiz=w>=h;
  items.forEach(it=>{
    const frac=Math.max(it.size||0,1)/total;
    if(horiz){const ww=frac*w;out.push({...it,x:x+acc,y,w:ww,h});acc+=ww}
    else{const hh=frac*h;out.push({...it,x,y:y+acc,w,h:hh});acc+=hh}
  });
  return out;
}
function drawTreemapInto(canvas,tip,items,parent,onClick){
  if(!canvas||!items||!items.length)return;
  const dpr=devicePixelRatio||1;
  canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=canvas.clientWidth,H=canvas.clientHeight;
  const palette=['rgba(224,120,86,.78)','rgba(90,143,192,.78)','rgba(94,168,122,.78)','rgba(160,120,192,.78)','rgba(212,160,64,.78)','rgba(90,184,176,.78)'];
  const rects=sliceRects(items.slice(0,18),4,4,W-8,H-8);
  window._tmRects=rects;
  ctx.clearRect(0,0,W,H);
  rects.forEach((r,i)=>{
    ctx.fillStyle=palette[i%palette.length];
    ctx.fillRect(r.x,r.y,Math.max(0,r.w-2),Math.max(0,r.h-2));
    if(r.w>56&&r.h>28){
      ctx.fillStyle='#fff';ctx.font='12px sans-serif';
      ctx.fillText((r.name||'').slice(0,18),r.x+6,r.y+18);
      ctx.font='10px monospace';
      ctx.fillText(r.size_human||'',r.x+6,r.y+34);
    }
  });
  canvas.onclick=e=>{
    const b=canvas.getBoundingClientRect();
    const x=e.clientX-b.left,y=e.clientY-b.top;
    const hit=rects.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    if(hit&&onClick)onClick(hit);
  };
  canvas.onmousemove=e=>{
    if(!tip)return;
    const b=canvas.getBoundingClientRect();
    const x=e.clientX-b.left,y=e.clientY-b.top;
    const hit=rects.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    if(!hit){tip.style.display='none';return}
    tip.style.display='block';tip.style.left=x+10+'px';tip.style.top=y+10+'px';
    tip.textContent=`${hit.name} · ${hit.size_human||''}${hit.dir?' · 目录':''}`;
  };
}
function drawForceGraph(canvas,graph){
  if(!canvas||!graph||!graph.nodes)return;
  const W=canvas.width,H=canvas.height,ctx=canvas.getContext('2d');
  const nodes=graph.nodes.map(n=>({...n,x:W/2+(Math.random()-0.5)*120,y:H/2+(Math.random()-0.5)*80,vx:0,vy:0}));
  const map=Object.fromEntries(nodes.map(n=>[n.id,n]));
  for(let t=0;t<90;t++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        let dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,d=Math.max(28,Math.hypot(dx,dy)),f=280/(d*d);
        nodes[i].vx-=f*dx/d;nodes[i].vy-=f*dy/d;nodes[j].vx+=f*dx/d;nodes[j].vy+=f*dy/d;
      }
    }
    (graph.edges||[]).forEach(e=>{
      const a=map[e.source],b=map[e.target];if(!a||!b)return;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-86)*0.015;
      a.vx+=f*dx/d;a.vy+=f*dy/d;b.vx-=f*dx/d;b.vy-=f*dy/d;
    });
    nodes.forEach(n=>{n.vx*=0.72;n.vy*=0.72;n.x=Math.max(28,Math.min(W-28,n.x+n.vx));n.y=Math.max(28,Math.min(H-28,n.y+n.vy))});
  }
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(224,120,86,.35)';ctx.lineWidth=1.2;
  (graph.edges||[]).forEach(e=>{const a=map[e.source],b=map[e.target];if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
  nodes.forEach(n=>{
    ctx.beginPath();ctx.fillStyle=n.missing?'#d06058':'#e07856';ctx.arc(n.x,n.y,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text')||'#222';
    ctx.font='11px sans-serif';ctx.fillText(n.name||'',n.x+10,n.y+4);
  });
}
async function compareSelectedSnaps(){
  const sel=Array.from(document.querySelectorAll('.snap-cb:checked')).map(c=>c.dataset.path);
  if(sel.length!==2){toast('请恰好勾选两个备份/快照','warn');return}
  const d=await api('/api/snapshot/compare',{method:'POST',body:{path_a:sel[0],path_b:sel[1]}});
  if(!d?.ok){toast(d?.error||'对比失败','error');return}
  showModal(`<div class="modal-title">快照对比 · ${d.diff||0} 处不同</div><div class="modal-body"><div class="table-wrap" style="max-height:360px;overflow:auto"><table><thead><tr><th>包</th><th>A</th><th>B</th></tr></thead><tbody>
    ${(d.rows||[]).filter(r=>r.status!=='same').map(r=>`<tr><td class="mono">${esc(r.name)}</td><td class="mono">${esc(r.a||'—')}</td><td class="mono">${esc(r.b||'—')}</td></tr>`).join('')||'<tr><td colspan="3">完全一致</td></tr>'}
  </tbody></table></div></div><div class="modal-footer"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
function portContext(e,pid,port){
  e.preventDefault();
  const items=[{label:'复制端口',fn:()=>copyPath(String(port))}];
  if(pid)items.push({label:'终止进程',fn:()=>killProcess(pid)});
  showCtx(e.clientX,e.clientY,items);
}
function gitContext(e,i){
  e.preventDefault();
  const r=(window._gitRepos||[])[i];if(!r)return;
  showCtx(e.clientX,e.clientY,[
    {label:'复制路径',fn:()=>copyPath(r.path)},
    {label:'打开目录',fn:()=>openPath(r.path)},
    {label:'查看详情',fn:()=>gitDetail(i)}
  ]);
}
async function fillPluginManifest(){
  const box=$('pluginManifest');if(!box)return;
  const d=await api('/api/plugins');
  const list=d?.plugins||[];
  box.innerHTML=list.map(p=>`<div class="glass-light" style="padding:10px 12px;border-radius:10px;margin-bottom:8px"><strong>${esc(p.name)}</strong> <span class="mono" style="font-size:11px;color:var(--text-3)">/api/plugin/${esc(p.id)}/{${(p.actions||[]).join('|')}}</span><div style="font-size:12px;color:var(--text-2);margin-top:4px">${esc(p.desc||'')}</div></div>`).join('')||'';
}

/* ================================================================
   初始化
   ================================================================ */
(async function init(){
  try{
    if(!sessionStorage.getItem('avengerBooted')){
      sessionStorage.setItem('avengerBooted','1');
      const ov=document.createElement('div');ov.className='boot-overlay';
      ov.innerHTML='<div class="boot-logo">A</div><div class="boot-title">AVENGER V6.0</div><div class="boot-bar"><i></i></div>';
      document.body.appendChild(ov);
      setTimeout(()=>ov.classList.add('done'),1250);
      setTimeout(()=>ov.remove(),1850);
    }
  }catch(e){}
  applyChrome();
  tickClock();
  setInterval(()=>{tickClock();applyChrome()},30000);
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(prefs.get('themeMode','system')==='system')applyChrome()});
  const th=document.documentElement.getAttribute('data-theme');
  if($('themeBtn'))$('themeBtn').innerHTML=icon(th==='dark'?'i-sun':'i-moon');
  applyPluginNav();
  if(prefs.get('sidebarFold',false))document.documentElement.classList.add('sidebar-collapsed');
  applySkin();mountPet();
  document.addEventListener('mousemove',e=>{
    _lastActive=Date.now();
    const card=e.target.closest&&e.target.closest('.glass');
    if(!card)return;
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
  },{passive:true});
  document.addEventListener('mouseover',e=>{
    const card=e.target.closest&&e.target.closest('.stat-card,.tool-card,.plugin-card');
    if(!card)return;
    const now=Date.now();if(now-(window._burstAt||0)<500)return;window._burstAt=now;
    const r=card.getBoundingClientRect();burstSparkles(r.left+r.width*0.5,r.top+18);
  },{passive:true});
  document.addEventListener('keydown',()=>{_lastActive=Date.now()},{passive:true});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();openSpotlight()}
  });
  loadEnvironments().then(()=>{if(currentModule==='dashboard')loadDashboard(navToken)});
  (function pollScan(){
    api('/api/scan-status').then(s=>{
      if(s&&s.scanning){setTimeout(pollScan,900);return}
      loadEnvironments().then(()=>{if(currentModule==='dashboard'||currentModule==='python'||currentModule==='packages')switchModule(currentModule)});
    });
  })();
  if(prefs.get('particleLevel', prefs.get('particles',true)?'mid':'off')!=='off')initParticles();
  init3DBg();
  switchModule(prefs.get('lastModule','dashboard'));
  applyEyeSchedule();
  if(!prefs.get('tourDone',false))setTimeout(startTour,800);
  Avenger.registerPlugin({id:'git',name:'Git 辅助',module:'git',onLoad(){}});
  Avenger.registerPlugin({id:'disk',name:'磁盘分析',module:'hardware',onLoad(){}});
})();
</script>
